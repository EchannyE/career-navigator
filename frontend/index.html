<!doctype html>
<html lang="en">
  <head>
    <!-- Basic setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>
      Career Coach Navigator
    </title>
    <meta
      name="description"
      content="AI-powered resume and job match analysis platform. Compare your resume with job descriptions, identify skill gaps, and get a personalized career improvement roadmap."
    />
     <meta
      name="keywords"
      content="resume analyzer, job match, AI career coach, resume gap analysis, career roadmap, resume optimization"
    />
    <meta name="author" content="Career Coach Navigator" />

    <!-- Theme color for mobile browser -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph -->
    <meta property="og:title" content="Career Coach Navigator" />
    <meta
      property="og:description"
      content="AI-powered resume analysis and career fit dashboard."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Career Coach Navigator" />
    <meta
      name="twitter:description"
      content="AI-powered resume analysis and personalized career roadmap."
    />
    <meta name="twitter:image" content="/preview.png" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
